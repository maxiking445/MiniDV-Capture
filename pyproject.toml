[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidv-capture"
version = "0.1.0"
description = "Native, data-safe MiniDV capture for Linux"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]
license = "MIT"

[project.scripts]
minidv-capture = "minidv_capture.__main__:main"

[tool.setuptools.packages.find]
include = ["minidv_capture*"]
