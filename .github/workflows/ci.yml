name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and GUI smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system media and Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkexec polkitd libraw1394-11 libavc1394-0 dvgrab ffmpeg librsvg2-bin libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxkbcommon-x11-0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Check GUI startup
        run: timeout --kill-after=5s 30s python -m minidv_capture --smoke-test

      - name: Build and smoke test the frozen application
        timeout-minutes: 10
        run: ./packaging/build-appimage.sh --onedir-only

      - name: Upload packaging diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-packaging-diagnostics
          path: |
            build/smoke.*/
            build/minidv-capture/warn-*.txt
          if-no-files-found: ignore
