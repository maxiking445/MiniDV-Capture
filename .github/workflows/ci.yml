name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and GUI smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system media and Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes dvgrab ffmpeg libegl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Check GUI startup
        run: python -m minidv_capture --smoke-test
